<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open Business Aid</title>
  <style>
    body { margin: 0; padding: 24px; min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; color: #202124; background: #f8f9fa; }
    main { max-width: 420px; padding: 28px; background: white; border: 1px solid #dadce0; border-radius: 12px; }
    h1 { margin-top: 0; font-size: 24px; }
    a { display: block; padding: 12px 16px; margin-top: 12px; text-align: center; border-radius: 6px; color: white; background: #185abc; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #202124; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Open Business Aid</h1>
    <p>If Chrome did not open, try the button below. If Chrome is unavailable, install it from Google Play.</p>
    <a id="chrome" href="https://businessaid.mashalsystems.com/">Open in Chrome</a>
    <a href="https://play.google.com/store/apps/details?id=com.android.chrome">Get Chrome on Google Play</a>
    <noscript><p>Enable JavaScript to launch Chrome automatically, or <a href="https://businessaid.mashalsystems.com/">continue to Business Aid</a>.</p></noscript>
  </main>
  <script src="/js/open.js"></script>
</body>
</html>
