name: Deploy environment
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [Test, Production]
        required: true
      api_origin:
        description: HTTPS API origin compiled into the PWA
        type: string
        default: https://api-businessaid.mashalsystems.com
        required: true
      database_ready_confirmed:
        description: I reviewed database/migrations and manually applied any required scripts to this environment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  build-test:
    uses: ./.github/workflows/validate.yml
    with:
      api_origin: ${{ inputs.api_origin }}
  verify-deployment:
    name: Verify deployment inputs
    needs: build-test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      EXPECTED_API_ORIGIN: ${{ vars.API_ORIGIN }}
      REQUESTED_API_ORIGIN: ${{ inputs.api_origin }}
      DATABASE_READY_CONFIRMED: ${{ inputs.database_ready_confirmed }}
    steps:
      - name: Validate deployment configuration
        run: |
          if [ -z "$EXPECTED_API_ORIGIN" ] || [ "$EXPECTED_API_ORIGIN" != "$REQUESTED_API_ORIGIN" ]; then
            echo 'API origin must match the selected GitHub Environment.' >&2
            exit 1
          fi
          if [ "$DATABASE_READY_CONFIRMED" != 'true' ]; then
            echo 'Review and manually apply required database/migrations scripts, then confirm database readiness.' >&2
            exit 1
          fi
          echo 'Database readiness was manually confirmed. This workflow did not access or modify the database.'
  deploy-api:
    name: Deploy ASP.NET Core to MyASP.NET
    needs: verify-deployment
    runs-on: windows-latest
    environment: ${{ inputs.environment }}
    env:
      MASHAL_ENVIRONMENT: ${{ inputs.environment }}
      ConnectionStrings__Mashal: ${{ secrets.SQL_APP_CONNECTION_STRING }}
      Google__ClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
      Google__ClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DataProtection__CertificateBase64: ${{ secrets.DATA_PROTECTION_CERTIFICATE_BASE64 }}
      DataProtection__CertificatePassword: ${{ secrets.DATA_PROTECTION_CERTIFICATE_PASSWORD }}
      App__Origin: ${{ vars.PWA_ORIGIN }}
      MASHAL_ADMIN_EMAILS: ${{ vars.MASHAL_ADMIN_EMAILS }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      WEBDEPLOY_ENDPOINT: ${{ secrets.WEBDEPLOY_ENDPOINT }}
      WEBDEPLOY_SITE: ${{ secrets.WEBDEPLOY_SITE }}
      WEBDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
      WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: artifacts/api
      - name: Verify database connectivity and schema
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $connection = [System.Data.SqlClient.SqlConnection]::new($env:ConnectionStrings__Mashal)
          try {
            $connection.Open()
            $checks = [ordered]@{
              'dbo.Businesses' = "OBJECT_ID(N'dbo.Businesses', N'U')"
              'dbo.Users.PhoneNumber' = "COL_LENGTH(N'dbo.Users', N'PhoneNumber')"
              'dbo.Users.EmailVerified' = "COL_LENGTH(N'dbo.Users', N'EmailVerified')"
              'dbo.Products.RecipeBatchYield' = "COL_LENGTH(N'dbo.Products', N'RecipeBatchYield')"
              'dbo.BusinessRequests' = "OBJECT_ID(N'dbo.BusinessRequests', N'U')"
              'dbo.AdminAudit' = "OBJECT_ID(N'dbo.AdminAudit', N'U')"
            }
            $missing = foreach ($check in $checks.GetEnumerator()) {
              $command = $connection.CreateCommand()
              $command.CommandText = "SELECT $($check.Value)"
              $command.CommandTimeout = 20
              try {
                $result = $command.ExecuteScalar()
                if ($null -eq $result -or $result -is [DBNull]) { $check.Key }
              } finally {
                $command.Dispose()
              }
            }
            if ($missing) {
              throw "Production database schema is missing: $($missing -join ', '). Apply the forward-only SQL migrations manually."
            }
            Write-Host 'Production database connectivity and schema validation passed.'
          } catch [System.Data.SqlClient.SqlException] {
            $sql = $_.Exception
            throw "Production database validation failed with SQL error $($sql.Number), state $($sql.State), class $($sql.Class)."
          } finally {
            $connection.Dispose()
          }
      - name: Install Web Deploy
        shell: pwsh
        run: choco install webdeploy --yes --no-progress
      - name: Configure and deploy API
        shell: pwsh
        run: ./scripts/deploy-api.ps1
      - name: API readiness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Wait-ForHealth([string]$Path, [string]$ExpectedStatus) {
            $lastFailure = 'No response received.'
            foreach ($attempt in 1..6) {
              try {
                $response = Invoke-RestMethod "$env:API_ORIGIN$Path" -TimeoutSec 20
                if ($response.status -eq $ExpectedStatus) { return }
                $lastFailure = "Unexpected status '$($response.status)'."
              } catch {
                $statusCode = [int]$_.Exception.Response.StatusCode
                $lastFailure = if ($statusCode) { "HTTP $statusCode" } else { $_.Exception.Message }
              }
              if ($attempt -lt 6) { Start-Sleep -Seconds 5 }
            }
            throw "API health check $Path failed after 6 attempts: $lastFailure"
          }

          # Live isolates application startup from database connectivity. Ready
          # then verifies that the manually prepared database can be reached.
          Wait-ForHealth '/health/live' 'ok'
          Wait-ForHealth '/health/ready' 'ready'
  deploy-pwa:
    name: Deploy PWA to Firebase Hosting
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      PWA_ORIGIN: ${{ vars.PWA_ORIGIN }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pwa
          path: artifacts/pwa/wwwroot
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy validated PWA artifact
        run: |
          npx firebase-tools@14.12.1 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config firebase.json --non-interactive
      - name: Verify release and security boundaries
        shell: pwsh
        run: ./scripts/smoke-release.ps1
