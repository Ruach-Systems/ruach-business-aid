name: Deploy environment
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [Test, Production]
        required: true
      api_origin:
        description: HTTPS API origin compiled into the PWA
        type: string
        default: https://api.businessaid.mashalsystems.com
        required: true
      database_ready_confirmed:
        description: I reviewed database/migrations and manually applied any required scripts to this environment
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  build-test:
    uses: ./.github/workflows/validate.yml
    with:
      api_origin: ${{ inputs.api_origin }}
  verify-deployment:
    name: Verify deployment inputs
    needs: build-test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      EXPECTED_API_ORIGIN: ${{ vars.API_ORIGIN }}
      REQUESTED_API_ORIGIN: ${{ inputs.api_origin }}
      DATABASE_READY_CONFIRMED: ${{ inputs.database_ready_confirmed }}
    steps:
      - name: Validate deployment configuration
        run: |
          if [ -z "$EXPECTED_API_ORIGIN" ] || [ "$EXPECTED_API_ORIGIN" != "$REQUESTED_API_ORIGIN" ]; then
            echo 'API origin must match the selected GitHub Environment.' >&2
            exit 1
          fi
          if [ "$DATABASE_READY_CONFIRMED" != 'true' ]; then
            echo 'Review and manually apply required database/migrations scripts, then confirm database readiness.' >&2
            exit 1
          fi
          echo 'Database readiness was manually confirmed. This workflow did not access or modify the database.'
  deploy-api:
    name: Deploy ASP.NET Core to MyASP.NET
    needs: verify-deployment
    runs-on: windows-latest
    environment: ${{ inputs.environment }}
    env:
      MASHAL_ENVIRONMENT: ${{ inputs.environment }}
      ConnectionStrings__Mashal: ${{ secrets.SQL_APP_CONNECTION_STRING }}
      Google__ClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
      Google__ClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DataProtection__CertificateBase64: ${{ secrets.DATA_PROTECTION_CERTIFICATE_BASE64 }}
      DataProtection__CertificatePassword: ${{ secrets.DATA_PROTECTION_CERTIFICATE_PASSWORD }}
      App__Origin: ${{ vars.PWA_ORIGIN }}
      MASHAL_ADMIN_EMAILS: ${{ vars.MASHAL_ADMIN_EMAILS }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      WEBDEPLOY_ENDPOINT: ${{ secrets.WEBDEPLOY_ENDPOINT }}
      WEBDEPLOY_SITE: ${{ secrets.WEBDEPLOY_SITE }}
      WEBDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
      WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: artifacts/api
      - name: Install Web Deploy
        shell: pwsh
        run: choco install webdeploy --yes --no-progress
      - name: Configure and deploy API
        shell: pwsh
        run: ./scripts/deploy-api.ps1
      - name: API readiness
        shell: pwsh
        run: |
          $ready = Invoke-RestMethod "$env:API_ORIGIN/health/ready"
          if ($ready.status -ne 'ready') { throw 'API readiness check failed.' }
  deploy-pwa:
    name: Deploy PWA to Firebase Hosting
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      PWA_ORIGIN: ${{ vars.PWA_ORIGIN }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pwa
          path: artifacts/pwa/wwwroot
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy validated PWA artifact
        run: |
          npx firebase-tools@14.12.1 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config firebase.json --non-interactive
      - name: Verify release and security boundaries
        shell: pwsh
        run: ./scripts/smoke-release.ps1
