name: Build and test
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:
    inputs:
      api_origin:
        type: string
        default: https://api-businessaid.mashalsystems.com
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: ${{ inputs.api_origin || 'https://api-businessaid.mashalsystems.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Mashal.BusinessAid.slnx
      - name: Build and unit/component tests
        run: |
          dotnet build Mashal.BusinessAid.slnx --no-restore -c Release
          dotnet test tests/Mashal.BusinessAid.Tests --no-build -c Release --filter "Category!=Integration&Category!=Browser"
      - name: Start isolated SQL Server and create database
        shell: bash
        run: |
          password="Ci-$(openssl rand -hex 24)!"
          echo "::add-mask::$password"
          echo "ConnectionStrings__Mashal=Server=localhost,1433;Database=MashalTests;User Id=sa;Password=$password;TrustServerCertificate=true" >> "$GITHUB_ENV"
          docker run -d --name mashal-test-sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..60}; do
            if docker exec mashal-test-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -Q 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mashal-test-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -Q 'CREATE DATABASE MashalTests'
      - name: Apply migrations and run SQL/API integration tests
        run: |
          dotnet run --no-build -c Release --project tools/Mashal.BusinessAid.Migrations
          dotnet test tests/Mashal.BusinessAid.Tests --no-build -c Release --filter "Category=Integration"
          dotnet run --no-build -c Release --project tools/Mashal.BusinessAid.Migrations
          dotnet run --no-build -c Release --project tools/Mashal.BusinessAid.Migrations -- --verify-no-pending
      - name: Publish PWA
        shell: pwsh
        run: |
          $uri = [Uri]$env:API_ORIGIN
          if ($uri.Scheme -ne 'https' -or $uri.AbsolutePath -ne '/' -or $uri.Query -or $uri.Fragment) { throw 'API_ORIGIN must be an HTTPS origin.' }
          dotnet publish src/Mashal.BusinessAid.Client -c Release -o artifacts/pwa "-p:ApiOrigin=$env:API_ORIGIN"
          if ($LASTEXITCODE -ne 0) { throw 'PWA publish failed.' }
          ./scripts/verify-release.ps1
      - name: Install browser test runtime
        shell: pwsh
        run: ./tests/Mashal.BusinessAid.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Published PWA, responsive, offline and upgrade tests
        env:
          MASHAL_BROWSER_TESTS: 'true'
        run: dotnet test tests/Mashal.BusinessAid.Tests --no-build -c Release --filter "Category=Browser"
      - name: Publish API
        shell: pwsh
        run: |
          # MyASP.NET supports framework-dependent deployments and launches them
          # through the installed dotnet host. Avoid a machine-specific apphost.
          dotnet publish src/Mashal.BusinessAid.Api -c Release -o artifacts/api
          if ($LASTEXITCODE -ne 0) { throw 'API publish failed.' }

          [xml]$config = Get-Content artifacts/api/web.config
          $aspNetCore = $config.SelectSingleNode('//aspNetCore')
          if ($aspNetCore.processPath -ne 'dotnet' -or $aspNetCore.arguments -ne '.\Mashal.BusinessAid.Api.dll') {
            throw 'The API artifact is not configured as a portable framework-dependent deployment.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: artifacts/api
      - uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: artifacts/pwa/wwwroot
